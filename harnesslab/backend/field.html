<title>The Field · harnesslab</title>
<!-- No webfont link. The exported Field must open with zero network requests, and a Google
     Fonts stylesheet is a request. The deck faces are named first in --sans/--mono below and
     degrade to the system stack where they are not installed. -->
<style>
__FONTS__
:root{
  /* Black-and-white instrument bench with cyanotype/orange/red carrying every signal.
     A pass is a measured quantity, so it is painted in the same cyanotype every
     measured quantity is (--measure in frontend/src/index.css, which this mirrors);
     --A (orange) is the "system A" / accent identity and the attention colour;
     --B leans white here (and near-black in light mode) so the second-system
     comparison stays inside the palette instead of reaching for a fourth hue.

     There WAS a green here. Retiring it also fixed a defect nobody had measured:
     the light theme's #1E9E5C sat at 3.29:1 against this document's paper, below
     WCAG AA. The cyanotype clears it on both grounds, and a test now says so. */
  --bg:#05070B;--bg2:#0A0F17;--panel:#0C1119;--line:rgba(139,153,173,.22);--line2:rgba(139,153,173,.4);
  --ink:#E4EBF5;--ink2:#C1CCDC;--muted:#8B99AD;--faint:#6B7787;
  --pass:#4D8DFF;--fail:#F0616D;--unres:#6B7787;--A:#79E0FF;--B:#E4EBF5;--amber:#9FC6FF;
  --passBg:rgba(77,141,255,.16);--failBg:rgba(240,97,109,.16);--ABg:rgba(121,224,255,.16);--BBg:rgba(228,235,245,.14);--amberBg:rgba(159,198,255,.14);
  /* three washes/borders that were spelled out as raw rgba() literals at their one call site each
     (a kbd border, a hover fill, a selected-row fill) instead of living here with the rest of the
     palette; unlike the tokens above they were never theme-dependent, so they are not repeated in
     the light-theme block below. */
  --kbd-invert-border:rgba(0,0,0,.3);--hover-wash:rgba(255,255,255,.02);--row-selected-wash:rgba(255,255,255,.05);
  --sans:'IBM Plex Sans',"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:'IBM Plex Mono',"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  /* chart-recorder paper: bone, not a blue-grey UI white */
  --bg:#FAFAFB;--bg2:#F0F2F6;--panel:#FFFFFF;--line:rgba(12,17,25,.14);--line2:rgba(12,17,25,.26);
  --ink:#0C1119;--ink2:#39424F;--muted:#5C6878;--faint:#8B99AD;
  --pass:#1D53C4;--fail:#B32A34;--unres:#8B99AD;--A:#0E6E8C;--B:#0C1119;--amber:#1D53C4;
  --passBg:rgba(29,83,196,.13);--failBg:rgba(179,42,52,.13);--ABg:rgba(14,110,140,.13);--BBg:rgba(12,17,25,.08);--amberBg:rgba(29,83,196,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:grid;grid-template-rows:50px 1fr 76px;height:100vh;position:relative}
/* top */
.top{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
@media (max-width:1560px){.top{gap:8px}.top .lbl,.btn kbd{display:none}}
.wm{font:600 12px/1 var(--mono);letter-spacing:.22em;color:var(--ink)}
.wm i{display:inline-block;width:8px;height:8px;background:var(--pass);border-radius:50%;margin-right:9px;vertical-align:0}
.state{font:11.5px/1 var(--mono);color:var(--ink);letter-spacing:.02em}
.state b{color:var(--ink);font-weight:600}
.sp{flex:1}
.lbl{font:10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.seg{display:flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;border-right:1px solid var(--line2);color:var(--ink);font:500 12px var(--sans);padding:7px 13px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--A);outline-offset:1px}
.btn{background:transparent;border:1px solid var(--line2);color:var(--ink);font:500 12px var(--sans);padding:7px 12px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn kbd{font:10px var(--mono);color:var(--ink);opacity:.7;border:1px solid var(--line2);border-radius:3px;padding:1px 4px}
.btn.k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.k kbd{color:var(--bg);border-color:var(--kbd-invert-border)}
.btn:disabled{opacity:.45;cursor:default}
/* stage */
.stage{position:relative;overflow:hidden;background:var(--bg)}
svg#field{position:absolute;inset:0;width:100%;height:100%}
svg text{font-family:var(--mono);fill:var(--muted);font-size:11px}
svg .sysl{fill:var(--ink2);font-size:12px;cursor:pointer}
svg .sysl.A{fill:var(--A)} svg .sysl.B{fill:var(--B)}
svg .taskl{font-size:10.5px;fill:var(--faint)}
svg .blk{cursor:pointer}
svg .blkbg{fill:transparent;stroke:transparent;stroke-width:1;rx:3}
svg .blk:hover .blkbg{stroke:var(--line2);fill:var(--hover-wash)}
svg .p1{fill:var(--ink);font-size:12.5px;font-weight:500}
svg .ci{stroke:var(--A);stroke-width:2;opacity:.85;stroke-linecap:round}
svg .cie{stroke:var(--A);stroke-width:2;opacity:.95}
svg .lead{stroke:var(--ink);stroke-dasharray:3 3;opacity:.5}
svg .axis{stroke:var(--line2)}
svg .axisl{font-size:10px;fill:var(--faint)}
svg .hist{fill:var(--A);opacity:.85}
svg .histl{font-size:10px;fill:var(--muted)}
svg .strip{cursor:pointer}
svg .stripl{font-size:11px;fill:var(--muted)}
svg .verd{font-size:11px;font-weight:600;letter-spacing:.06em}
svg .caption{font-family:var(--sans);font-size:12.5px;fill:var(--ink2)}
svg .capk{font-size:10.5px;letter-spacing:.16em;fill:var(--muted)}
svg .dot.flag{stroke:var(--ink);stroke-width:1.6}
svg .ltr{font-family:var(--mono);font-size:13px;font-weight:700;text-anchor:middle;pointer-events:none}
svg .ltrbox.bad{stroke:var(--fail);stroke-width:1.6}
svg .badge{font-family:var(--mono);font-size:10px;fill:var(--fail)}
.legend{position:absolute;left:18px;right:18px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.legend .grp{font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 4px 0 6px}
.legend .ch{font:11px var(--mono);color:var(--ink2);border:1px solid var(--line2);border-radius:3px;padding:3px 8px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;background:var(--bg2)}
.legend .ch b{color:var(--fail);font-weight:600}
.legend .ch.off{opacity:.38}
.legend .ch:hover{border-color:var(--muted)}
.legend .alpha{margin-left:auto;font:10.5px var(--mono);color:var(--muted);display:inline-flex;gap:9px}
.legend .alpha i{font-style:normal;color:var(--ink);font-weight:600}
/* bottom band: the uncertainty is chrome */
.band{border-top:1px solid var(--line);background:var(--bg2);display:grid;grid-template-columns:280px 1fr 380px;align-items:center;padding:0 18px;gap:24px}
.band .scope{font:11px/1.5 var(--mono);color:var(--muted)}
.band .scope b{color:var(--ink);font-weight:500;display:block;font-size:12px}
.band .scope u{text-decoration:none;color:var(--faint)}
.unc{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.unc .v{font:600 30px/1 var(--sans);letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.unc .v u{text-decoration:none;font-size:.55em;color:var(--muted);font-weight:500}
.unc .g{position:relative;height:28px}
.unc .g .ax{position:absolute;left:0;right:0;top:14px;height:1px;background:var(--line2)}
.unc .g .iv{position:absolute;top:10px;height:9px;background:var(--passBg);border-left:1.5px solid var(--pass);border-right:1.5px solid var(--pass);transition:left .6s cubic-bezier(.2,.7,.2,1),right .6s cubic-bezier(.2,.7,.2,1)}
.unc .g .pt{position:absolute;top:9px;width:11px;height:11px;border-radius:50%;background:var(--pass);transform:translateX(-5.5px);transition:left .6s cubic-bezier(.2,.7,.2,1);border:2px solid var(--bg2)}
.unc .g .tk{position:absolute;top:20px;font:9.5px var(--mono);color:var(--faint);transform:translateX(-50%)}
.unc .g .lbl2{position:absolute;left:0;top:-4px;font:10px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.thesis{font:italic 16px/1.3 var(--sans);color:var(--ink2);text-align:right}
.thesis b{font-style:normal;color:var(--ink);font-weight:400}
.thesis .n{font:600 26px/1 var(--sans);color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* panels over the stage */
.panel{position:absolute;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:14px 16px;font-size:12px;color:var(--ink2);animation:in .25s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel h4{margin:0 0 8px;padding-right:22px;font:600 12.5px var(--sans);color:var(--ink);display:flex;align-items:center;gap:8px}
.panel h4 .tag{font:10px var(--mono);letter-spacing:.1em;color:var(--muted);border:1px solid var(--line2);padding:2px 6px;border-radius:2px;margin-left:auto}
.panel .x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);cursor:pointer;font:14px var(--mono)}
.bom{font:11px var(--mono);color:var(--ink2)}
.bom .r{display:grid;grid-template-columns:22px 40px 1fr auto;gap:8px;padding:2.5px 0;border-bottom:1px solid var(--line)}
.bom .r .s{color:var(--faint);text-align:right}.bom .r .k{font-weight:600;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bom .r .k.T{color:var(--A)}.bom .r .k.E{color:var(--pass)}.bom .r .k.g{color:var(--amber)}.bom .r .k.b{color:var(--fail)}
.bom .r .v{color:var(--muted);text-align:right;white-space:nowrap}
.bom .tot{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;color:var(--ink)}
.callout{border-radius:4px;padding:8px 10px;margin-top:9px;font-size:11.5px;line-height:1.45}
.callout.ok{background:var(--passBg);color:var(--pass)} .callout.no{background:var(--amberBg);color:var(--amber)} .callout.fail{background:var(--failBg);color:var(--fail)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:11.5px}
.kv div:nth-child(odd){color:var(--muted)}
.cmp .row{display:grid;grid-template-columns:96px 1fr 84px;gap:10px;align-items:center;padding:3px 0;font:11px var(--mono)}
.cmp .row .g{position:relative;height:12px}
.cmp .row .g .ax{position:absolute;left:0;right:0;top:6px;height:1px;background:var(--line2)}
.cmp .row .g .z{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ink);opacity:.5}
.cmp .row .g .bar{position:absolute;top:3px;height:6px;border-radius:2px}
.cmp .row .v{text-align:right;color:var(--ink)}
.big{font:600 28px/1 var(--sans);letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.big u{text-decoration:none;font-size:.55em;color:var(--muted);font-weight:500}
.hint{font:11px var(--mono);color:var(--faint);margin-top:8px;line-height:1.5}
/* run panel */
.state .live{font-style:normal;color:var(--pass);font-weight:600}
.state .live.busy{color:var(--amber)} .state .live.off{color:var(--fail)}
.run .form{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;align-items:center;font:11px var(--mono);color:var(--muted)}
.run .form label{display:contents}
.run .form input,.run .form select{font:12px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:4px 6px;width:100%;box-sizing:border-box}
.run .form select[multiple]{padding:2px}
.run .form .chk{display:flex;grid-column:1 / -1;gap:8px;align-items:center;color:var(--ink2)}
.run .form .chk input{width:auto}
.run .est{margin-top:8px;font:11px var(--mono);color:var(--ink2)}
.run .btn.small{padding:1px 7px;font-size:10.5px;margin-left:auto}
.jobs{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.job{border:1px solid var(--line);border-radius:4px;padding:7px 9px;font:11px var(--mono);color:var(--ink2)}
.job.run{border-color:var(--line2)}
.job .jh{display:flex;gap:10px;align-items:center}.job .jh b{color:var(--ink)}.job .js{color:var(--muted)}
.job .jc{color:var(--muted);font-size:10.5px;margin:3px 0;word-break:break-all}
.job .jp{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:5px 0}.job .jp span{display:block;height:100%;background:var(--A)}
.job .jm{color:var(--muted);font-size:10.5px}
/* log drawer */
.log{position:absolute;top:0;right:0;bottom:0;width:300px;background:var(--bg2);border-left:1px solid var(--line);padding:14px 16px;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);overflow:auto}
.log.open{transform:none}
.log .h{font:10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.ev{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink2)}
.ev .t{font:10px var(--mono);color:var(--faint);padding-top:2px}
.ev .m{color:var(--muted);font-size:11px}
.ev .w{color:var(--amber);font-size:11px}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:500 12px var(--sans);padding:8px 14px;border-radius:4px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.help{position:absolute;left:18px;bottom:12px;font:10.5px var(--mono);color:var(--faint);letter-spacing:.04em}
.help kbd{color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:0 4px;font-size:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <div class="top">
    <span class="wm"><i></i>HARNESSLAB · FIELD</span>
    <span class="state" id="state"></span>
    <span class="sp"></span>
    <span class="lbl">oracle</span>
    <div class="seg" role="radiogroup" aria-label="oracle">
      <button data-o="v">visible</button><button data-o="hd" class="on">hidden</button><button data-o="s">strengthened</button>
    </div>
    <button class="btn" id="b_rank">rank <kbd>r</kbd></button>
    <button class="btn" id="b_boot" disabled>resample <kbd>b</kbd></button>
    <button class="btn" id="b_flags">flags <kbd>f</kbd></button>
    <button class="btn" id="b_run" hidden>run <kbd>n</kbd></button>
    <button class="btn" id="b_reset">field <kbd>esc</kbd></button>
    <button class="btn" id="b_log">log <kbd>l</kbd></button>
  </div>
  <div class="stage" id="stage">
    <svg id="field" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="toast" id="toast"></div>
    <div class="help" id="help">click a block to descend · click a system name to set arm A, another for B · <kbd>o</kbd> oracle · <kbd>r</kbd> rank · <kbd>b</kbd> resample · <kbd>f</kbd> flags</div>
    <div class="legend" id="legend" hidden></div>
    <div class="log" id="log"><div class="h"><span>session</span><span id="logn">0 entries</span></div><div id="logb"></div></div>
  </div>
  <div class="band">
    <div class="scope" id="scope"></div>
    <div class="unc"><div class="v" id="uv">—</div><div class="g"><span class="lbl2" id="ul">95% task bootstrap</span><span class="ax"></span><span class="iv" id="uiv"></span><span class="pt" id="upt"></span><span class="tk" style="left:0">0%</span><span class="tk" style="left:50%">50%</span><span class="tk" style="left:100%">100%</span></div></div>
    <div class="thesis" id="thesis">The runs never change. <b>Only the judge does.</b></div>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
// ============================================================ data
const DATA = JSON.parse(document.getElementById("data").textContent);
const LIVE = !!DATA.live;   // served by `python -m harnesslab`: /api/bundle is the source and the field grows while a job runs
const RES_DIR = DATA.results || "prerecorded_mock";
const API = { bundle: "/api/bundle?results=" + encodeURIComponent(RES_DIR), status: "/api/status?results=" + encodeURIComponent(RES_DIR) };
// Theme and oracle follow the console. Same origin, so localStorage is shared and `storage` fires here for
// every change made in the parent document (and there for every change made here).
const THEME_KEY = "hs.theme", ORACLE_KEY = "hs.oracle", NAV_KEYS = ["ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "End", " "];
const O_IN = { visible_pass: "v", hidden_pass: "hd", strong_pass: "s" }, O_OUT = { v: "visible_pass", hd: "hidden_pass", s: "strong_pass" };
function readOracle() { try { return localStorage.getItem(ORACLE_KEY); } catch (e) { return null; } }
function writeOracle(o) { try { if (localStorage.getItem(ORACLE_KEY) !== O_OUT[o]) localStorage.setItem(ORACLE_KEY, O_OUT[o]); } catch (e) {} }
function applyTheme() { try { document.documentElement.dataset.theme = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) {} }
applyTheme();
window.addEventListener("storage", e => { if (e.key === THEME_KEY) applyTheme(); else if (e.key === ORACLE_KEY && O_IN[e.newValue]) setOracle(O_IN[e.newValue]); });
const OK = { v: "visible", hd: "hidden", s: "strengthened" };
let RUNS = [], TASKS = [], SYSTEMS = [], bySys = {}, RESULTS = [], HARN = {}, REP = { n: 1, cols: 1, rows: 1 };

// The console bundle (/api/bundle, or the one embedded by --export-field) reduced to what the Field draws.
// One span per consequential action: c chat · t tool · E edit · g grade · b boundary event.
function compactBundle(b) {
  const F = b.features || {}, T = b.trajectories || {};
  const argOf = a => a ? (a.path || a.cmd || a.command || a.pattern || a.query || "") : "";
  const runs = b.runs.map(r => {
    const key = r.key || (r.results + "/" + r.run_id), f = F[key] || {}, sp = T[key] || [];
    const spans = [], seq = [];
    for (const x of sp) {
      if (x.span === "chat") { spans.push(["c", (x.calls && x.calls[0] && x.calls[0].name) || "", x.in || 0, x.out || 0]); seq.push("c"); }
      else if (x.span === "execute_tool") { spans.push(["t", x.tool, argOf(x.args), x.status]); seq.push({ run_tests: "T", write_file: "w", edit_file: "e", submit: "S" }[x.tool] || "t"); }
      else if (x.span === "edit") { spans.push(["E", x.path, x.la || 0, x.lr || 0]); seq.push("E"); }
      else if (x.span === "grade") { spans.push(["g", x.visible, x.hidden, x.strong]); seq.push("g"); }
      else if (x.span === "boundary_event") { spans.push(["b", x.kind, x.tool, x.status]); seq.push("b"); }
    }
    return { id: r.run_id, res: r.results, m: r.model, h: r.harness_id, t: r.task_id, rep: r.repeat_index, v: r.visible_pass, hd: r.hidden_pass, s: r.strong_pass,
      st: r.steps, tc: r.tool_calls,
      // `|| 0` turned "nobody metered this run" into "this run was free", and it was then summed
      // with runs that really were metered. Unknown stays unknown and is rendered as a dash.
      tok: (r.input_tokens == null || r.output_tokens == null) ? null : r.input_tokens + r.output_tokens,
      cost: r.cost_usd == null ? null : r.cost_usd, exit: r.exit_reason, ver: !!f.ran_after_last_edit, seq: seq.join(""), spans };
  });
  const tasks = Object.values(b.tasks || {}).map(t => ({ id: t.id, title: t.title, probe: t.probe || "none" }));
  const harnesses = {}; Object.entries(b.harnesses || {}).forEach(([k, h]) => { harnesses[k] = { tools: h.tools, policy: h.policy, max_steps: h.max_steps, ctx: h.context_window, sha: (h._sha || "").slice(0, 12), psha: (h._prompt_sha || "").slice(0, 12) }; });
  return { runs, tasks, harnesses };
}
// (Re)load a compact data set. Returns the runs that were not there before.
function load(data) {
  const old = new Set(RUNS.map(r => r.id));
  RUNS = data.runs; TASKS = data.tasks.map(t => t.id).sort(); HARN = data.harnesses || {};
  RUNS.forEach(r => { r.sys = r.m + " · " + r.h; r.an = analyse(r); });
  SYSTEMS = Array.from(new Set(RUNS.map(r => r.sys)));
  bySys = {}; RUNS.forEach(r => (bySys[r.sys] = bySys[r.sys] || []).push(r));
  RESULTS = Array.from(new Set(RUNS.map(r => r.res)));
  const maxRep = Math.max(1, ...RUNS.map(r => r.rep + 1)), cols = Math.min(5, maxRep); REP = { n: maxRep, cols, rows: Math.ceil(maxRep / cols) };
  $("state").innerHTML = `${LIVE ? `<i class="live" id="live">live</i> · ` : ""}<b>${RUNS.length}</b> runs · ${SYSTEMS.length} systems · ${TASKS.length} tasks · ${REP.n} repeats`;
  return RUNS.filter(r => !old.has(r.id));
}

// ============================================================ the action alphabet and the trajectory tests
// The alphabet is the console's: L list · R read · W write · E edit · T run tests · B bash · S submit.
// The nine predicates are the console's trajectory tests (core.js predicates()), computed here on the

  if (!JOBS.length) { el.innerHTML = `<div class="hint">no job launched from here yet</div>`; return; }
  el.innerHTML = `<div class="jobs">` + JOBS.slice().reverse().map(j => { const pct = j.total ? Math.round(100 * j.done / j.total) : 0;
    return `<div class="job ${j.status === "running" ? "run" : ""}"><div class="jh"><b>${esc(j.id)}</b><span class="js">${esc(j.status)}</span>${j.status === "running" ? `<button class="btn small" data-cancel="${esc(j.id)}">cancel</button>` : ""}</div>
      <div class="jc">${esc(j.cmd || [(j.models || []).join(", "), (j.harnesses || []).join(", "), j.repeats ? j.repeats + " repeats" : "", j.stop_reason || ""].filter(Boolean).join(" · "))}</div>
      <div class="jp"><span style="width:${pct}%"></span></div>
      <div class="jm">${j.total ? `${j.done}/${j.total} runs` : "starting"}${j.eta_s != null ? ` · eta ${Math.round(j.eta_s / 60)} min` : ""}${(() => { const t = j.elapsed_s != null ? j.elapsed_s : (j.created_at ? (j.finished_at || Date.now() / 1000) - j.created_at : null); return t != null ? ` · ${Math.round(t)} s` : ""; })()}${j.spent ? ` · $${Number(j.spent).toFixed(4)} so far` : ""} · → ${esc(j.out)}</div></div>`; }).join("") + `</div>`;
}
document.addEventListener("click", e => { const c = e.target.closest("[data-cancel]"); if (c) cancelJob(c.dataset.cancel); });

// ============================================================ interaction
function reset() { closePanels(); S.mode = "field"; S.sel = null; S.run = null; S.boot = null; S.order = sysOrder(S.oracle); layoutField(true, false); $("thesis").innerHTML = `The runs never change. <b>Only the judge does.</b>`; }
svg.addEventListener("click", e => {
  const blk = e.target.closest(".blk"); if (blk && S.mode === "field") { layoutCell(blk.dataset.sys, blk.dataset.task, true); return; }
  const st = e.target.closest(".strip"); if (st) { showBOM(st.dataset.run); return; }
  const sl = e.target.closest(".sysl"); if (sl) { const s = sl.dataset.sys; if (!S.A || (S.A && S.B)) { S.A = s; S.B = null; toast(`arm A · ${s} — click another system for B`); } else if (s !== S.A) { S.B = s; } if (S.mode === "field") layoutField(false); else if (S.mode === "rank") layoutRank(false); else layoutCell(S.sel.sys, S.sel.task, false); if (S.A && S.B) showCompare(); return; }
});
document.addEventListener("click", e => { if (e.target.closest("[data-x]")) { closePanels(); if (S.mode === "cell") { S.run = null; layoutCell(S.sel.sys, S.sel.task, false); } if (e.target.closest(".cmp")) { S.A = S.B = null; if (S.mode === "field") layoutField(false); else if (S.mode === "rank") layoutRank(false); } } });
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setOracle(b.dataset.o)));
$("b_rank").addEventListener("click", () => { closePanels(); layoutRank(true); });
$("b_boot").addEventListener("click", resample);
$("b_reset").addEventListener("click", reset);
$("b_run").addEventListener("click", showRun);
$("b_flags").addEventListener("click", () => { S.flags = !S.flags; $("b_flags").classList.toggle("k", S.flags); paintFlags(); if (S.mode === "cell") layoutCell(S.sel.sys, S.sel.task, false); else if (S.mode === "field") layoutField(true, false); log(S.flags ? "trajectory tests on" : "trajectory tests off", S.flags ? `${RUNS.filter(flagged).length} of ${RUNS.length} runs fail a selected test` : ""); });
$("legend").addEventListener("click", e => { const c = e.target.closest("[data-pred]"); if (!c) return; const id = c.dataset.pred; S.preds.has(id) ? S.preds.delete(id) : S.preds.add(id); paintFlags(); if (S.mode === "cell") layoutCell(S.sel.sys, S.sel.task, false); });
$("b_log").addEventListener("click", () => { S.logOpen = !S.logOpen; $("log").classList.toggle("open", S.logOpen); $("b_log").classList.toggle("k", S.logOpen); });
document.addEventListener("keydown", e => { if (e.target.matches("input,textarea")) return;
  if (window.parent !== window && NAV_KEYS.includes(e.key)) { e.preventDefault(); window.parent.postMessage({ type: "field:key", key: e.key }, "*"); return; }   // only a key name crosses; the receiver checks the shape
  if (e.key === "o") setOracle(S.oracle === "v" ? "hd" : S.oracle === "hd" ? "s" : "v");
  else if (e.key === "r") { closePanels(); layoutRank(true); } else if (e.key === "b") resample(); else if (e.key === "Escape") reset(); else if (e.key === "l") $("b_log").click(); else if (e.key === "f") $("b_flags").click(); else if (e.key === "n" && LIVE && DATA.launch) showRun(); });
window.addEventListener("resize", () => { measure(); if (S.mode === "field") layoutField(false); else if (S.mode === "rank") layoutRank(false); else layoutCell(S.sel.sys, S.sel.task, false); });

// ============================================================ boot
function boot(data) {
  measure(); load(data); RUNS.forEach(r => dotFor(r));
  const want = O_IN[readOracle()]; if (want && want !== S.oracle) { S.oracle = want; document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.o === want)); }
  S.order = sysOrder(S.oracle); layoutField(true, true);
  log(`loaded ${RUNS.length} runs`, `${RESULTS.join(" + ")} · ${SYSTEMS.length} systems · ${TASKS.length} tasks · ${OK[S.oracle]} oracle${LIVE ? " · live from harnesslab" : ""}`);
}
if (LIVE) { $("b_run").hidden = !DATA.launch; fetch(API.bundle).then(r => r.json()).then(b => { boot(compactBundle(b)); VERSION = null; poll(); setInterval(poll, 2500); }).catch(e => { $("state").innerHTML = "could not reach /api/bundle — is python -m harnesslab running?"; }); }
else boot(DATA.bundle ? compactBundle(DATA.bundle) : DATA);
window.__field = { S, pass1, taskTable, rankOf, lcg, paired, compactBundle, get RUNS() { return RUNS; }, get bySys() { return bySys; }, get REP() { return REP; }, get JOBS() { return JOBS; } };
})();
</script>
