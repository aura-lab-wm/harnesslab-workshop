<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The interval rail, at 16px: a point sitting inside its bracketed interval. The console's
       signature reduced to a mark -- an estimate is never shown without its uncertainty. -->
  <line x1="3" y1="16" x2="29" y2="16" stroke="#464E58" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="8.5" x2="9" y2="23.5" stroke="#5E9CFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="25" y1="8.5" x2="25" y2="23.5" stroke="#5E9CFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="9" y1="16" x2="25" y2="16" stroke="#5E9CFF" stroke-width="2.5"/>
  <circle cx="15" cy="16" r="5" fill="#5E9CFF"/>
</svg>
